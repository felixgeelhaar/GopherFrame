name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  security-events: write
  actions: read
  pages: write

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: |
        # Run all tests including examples
        go test -v -race ./...
        if [ $? -ne 0 ]; then
          echo "❌ Tests failed!"
          exit 1
        fi

        # Generate coverage only for pkg/ (exclude examples and cmd/)
        go test -v -race -coverprofile=coverage.out ./pkg/...
        if [ $? -ne 0 ]; then
          echo "❌ Coverage generation failed!"
          exit 1
        fi

    - name: Run property-based tests
      run: |
        go test -v -run TestProperty -count=3
        if [ $? -ne 0 ]; then
          echo "❌ Property-based tests failed!"
          exit 1
        fi

    - name: Install coverctl
      run: go install github.com/nicholasgasior/coverctl@latest
      continue-on-error: true

    - name: Check coverage with coverctl
      run: |
        if command -v coverctl &> /dev/null; then
          coverctl check --config .coverctl.yaml --from-profile --profile coverage.out || true
          echo "✅ coverctl check complete"
        else
          # Fallback to manual threshold check
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "📊 Current test coverage (pkg/): ${COVERAGE}%"
          THRESHOLD=60
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@0561704f0f02c16a585d4c7555e57fa2e44cf909 # v5.5.2
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: '1.25'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.7.2
        args: --timeout=5m

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Install Relicta
      run: |
        curl -sSfL https://github.com/relicta-tech/relicta/releases/latest/download/relicta_linux_amd64.tar.gz -o relicta.tar.gz
        tar xzf relicta.tar.gz
        chmod +x relicta
        sudo mv relicta /usr/local/bin/

    - name: Run Relicta release
      id: relicta
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        OUTPUT=$(relicta release --ci --clean --yes 2>&1)
        echo "$OUTPUT"
        VERSION=$(echo "$OUTPUT" | grep -oP 'Released \K[0-9]+\.[0-9]+\.[0-9]+')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: steps.relicta.outputs.version != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.relicta.outputs.tag }}" \
          --title "GopherFrame ${{ steps.relicta.outputs.tag }}" \
          --generate-notes
